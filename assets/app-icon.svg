<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD25E" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E0A01B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="water" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#2E528F"/>
      <stop offset="100%" stop-color="#0A1526"/>
    </radialGradient>
  </defs>
  
  <!-- Background Sky -->
  <rect width="64" height="64" fill="#0A0F1E"/>
  
  <!-- Stars -->
  <rect x="14" y="8" width="1" height="1" fill="#FFF" opacity="0.8"/>
  <rect x="48" y="12" width="1" height="1" fill="#FFF" opacity="0.6"/>
  <rect x="30" y="18" width="1" height="1" fill="#FFF" opacity="0.4"/>
  
  <!-- Moon / Light Box in sky -->
  <rect x="42" y="6" width="8" height="8" fill="#E6F0FF"/>
  <rect x="43" y="7" width="6" height="6" fill="#FFFFFF"/>
  
  <!-- Trees Silhouette -->
  <path fill="#0B1B14" d="M0 30h10v34H0zM54 30h10v34H54z"/>
  <path fill="#112B1E" d="M2 22h6v8H2zM6 16h6v14H6zM56 20h6v10h-6zM60 14h4v16h-4z"/>
  
  <!-- Water -->
  <rect x="0" y="44" width="64" height="20" fill="url(#water)"/>
  
  <!-- Water Pixels -->
  <path fill="#3C6AB0" d="M4 48h6v1H4zM18 50h8v1h-8zM40 46h10v1H40zM12 56h6v1h-6zM34 58h12v1H34zM50 52h8v1h-8z"/>
  <path fill="#1F3A68" d="M2 52h8v1H2zM22 54h10v1H22zM46 48h8v1h-8zM16 60h12v1H16zM38 50h6v1h-6z"/>
  
  <!-- Water Lilies / Green Pixels -->
  <rect x="12" y="56" width="4" height="3" fill="#4E8F5A"/>
  <rect x="44" y="54" width="5" height="3" fill="#4E8F5A"/>
  <rect x="36" y="60" width="3" height="2" fill="#4E8F5A"/>
  
  <!-- Glowing Honeycomb -->
  <circle cx="32" cy="34" r="20" fill="url(#glow)"/>
  <g transform="translate(16, 18) scale(1)">
    <!-- Base dark outline -->
    <path fill="#3D1A00" d="M12 4h8v2h-8zM8 8h4v2H8zM20 8h4v2h-4zM4 12h4v8H4zM24 12h4v8h-4zM8 20h4v2H8zM20 20h4v2h-4zM12 24h8v2h-8z"/>
    <!-- Mid Dark Orange -->
    <path fill="#A34300" d="M12 6h8v2h-8zM8 10h4v2H8zM20 10h4v2h-4zM6 14h2v4H6zM24 14h2v4h-2zM8 22h4v2H8zM20 22h4v2h-4zM12 26h8v2h-8z"/>
    <!-- Main Orange -->
    <path fill="#E86A00" d="M12 8h8v2h-8zM10 10h4v2h-4zM18 10h4v2h-4zM8 12h4v8H8zM20 12h4v8h-4zM10 20h4v2h-4zM18 20h4v2h-4zM12 22h8v2h-8z"/>
    <!-- Light Orange Highlights -->
    <path fill="#FF8C00" d="M14 10h4v2h-4zM12 12h4v4h-4zM16 12h4v4h-4zM12 16h8v2h-8zM10 18h4v2h-4zM18 18h4v2h-4zM14 20h4v2h-4z"/>
    <!-- Yellow Highlights -->
    <path fill="#FFD54A" d="M14 12h2v2h-2zM16 16h2v2h-2zM14 18h4v2h-4z"/>
  </g>
  
  <!-- Floating Sparkle Pixels -->
  <rect x="16" y="18" width="2" height="2" fill="#FFE08A"/>
  <rect x="46" y="26" width="1" height="1" fill="#FFE08A"/>
  <rect x="18" y="36" width="1" height="1" fill="#FFE08A"/>
  <rect x="44" y="38" width="2" height="2" fill="#FFE08A"/>
  <rect x="24" y="40" width="1" height="1" fill="#FFF"/>
</svg>
